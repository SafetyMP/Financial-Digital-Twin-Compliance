name: Governance demo Pages

on:
  push:
    branches: [main]
    paths:
      - 'apps/governance-console/**'
      - '.github/workflows/governance-pages.yml'
      - 'llms.txt'
      - 'scripts/check-governance-discovery.mjs'
  pull_request:
    paths:
      - 'apps/governance-console/**'
      - '.github/workflows/governance-pages.yml'
      - 'llms.txt'
      - 'scripts/check-governance-discovery.mjs'
  workflow_dispatch:

permissions: {}

concurrency:
  group: governance-pages-checks-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/governance-console
    env:
      NEXT_PUBLIC_BASE_PATH: /Financial-Digital-Twin-Compliance
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/governance-console/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Test demo behavior
        run: npm test
      - name: Export static site
        run: npm run build
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: apps/governance-console/out

  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: governance-pages-deployment
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy static demo
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
