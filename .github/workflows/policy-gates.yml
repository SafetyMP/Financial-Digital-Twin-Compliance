name: Policy gates

on:
  pull_request:
    paths:
      - "policies/**"
      - "services/cedar-service/**"
      - "services/decision-service/**"
      - "scripts/run-policy-ci.sh"


permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25"

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: "1.89"

      - name: Install Cedar CLI
        run: chmod +x scripts/install-cedar-cli.sh && ./scripts/install-cedar-cli.sh

      - name: Policy CI
        run: chmod +x scripts/run-policy-ci.sh && ./scripts/run-policy-ci.sh

      - name: Go tests (cedar-service)
        working-directory: services/cedar-service
        run: go test ./...

      - name: Go tests (decision-service)
        working-directory: services/decision-service
        run: go test ./...
