name: Bug report
description: Report a review-workflow problem, integration defect, or CI regression
title: "[bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the task you were trying to complete. Use synthetic examples and remove credentials, tokens, and customer data from logs or screenshots.
        For vulnerabilities, use [private reporting](https://github.com/SafetyMP/Financial-Digital-Twin-Compliance/security/advisories/new), not this form.
        [Support expectations](https://github.com/SafetyMP/Financial-Digital-Twin-Compliance/blob/main/SUPPORT.md)
  - type: dropdown
    id: mode
    attributes:
      label: Where did this happen?
      options:
        - Public GitHub Pages demo
        - Local synthetic governance demo
        - Connected governance workspace
        - Engineering console or backend reference stack
        - GitHub Actions CI or image publishing
        - Documentation or setup
        - Other / unsure
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Task and actual result
      description: What were you trying to do, and what happened instead?
      placeholder: I opened an issue's evidence panel, then tried to record a review...
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: UI actions or commands, using synthetic data. Include the issue/review state before and after the action if relevant.
      placeholder: |
        1. Open the governance workspace in connected mode.
        2. Select a synthetic issue and open Evidence.
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
      description: What would let you complete the task successfully?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit, release, or demo URL
      placeholder: Commit SHA, release tag, or the Pages URL and time observed
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser / device / runtime
      placeholder: Browser version and screen size, or OS, Node, Docker, and Compose versions
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence
      description: Relevant screenshot, error text, CI run URL and failing step, or service output. Do not include real records or secrets.
  - type: checkboxes
    id: privacy
    attributes:
      label: Data check
      options:
        - label: This report contains only synthetic or sanitized examples and no credentials or customer data.
          required: true
