name: Improvement proposal
description: Propose a clearer governance workflow or supporting capability
title: "[feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Start with the user's task and the friction, not only a feature name. Check the [roadmap](https://github.com/SafetyMP/Financial-Digital-Twin-Compliance/blob/main/ROADMAP.md) and use synthetic examples.
  - type: dropdown
    id: mode
    attributes:
      label: Area
      options:
        - Governance review workflow / ease of use
        - Connected identity, ownership, or follow-up
        - Evidence explanations or verification
        - Public synthetic demo
        - Backend / policy / Kafka integration
        - Graph / simulation / reporting reference capability
        - Accessibility
        - Documentation / discovery / setup
        - CI / deployment
        - Other / unsure
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Who needs this, and what task is difficult today?
      description: Describe the audience, current workflow, and concrete friction. Do not include customer information.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: What would the person be able to understand or do more easily?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach and alternatives
      description: Optional design or implementation idea, existing workaround, and relevant issue/design links.
  - type: textarea
    id: verification
    attributes:
      label: How could we verify the improvement?
      description: Examples include an observed user task, an accessibility check, or a reproducible integration scenario.
  - type: dropdown
    id: roadmap
    attributes:
      label: Roadmap relationship
      options:
        - Improves a capability available now
        - Matches a next priority in ROADMAP.md
        - New proposal for discussion
        - Unsure
    validations:
      required: true
