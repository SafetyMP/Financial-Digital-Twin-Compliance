services:
  core-banking-db:
    image: postgres:16@sha256:be01cf82fc7dbba824acf0a82e150b4b360f3ff93c6631d7844af431e841a95c
    environment:
      POSTGRES_USER: core
      POSTGRES_PASSWORD: core
      POSTGRES_DB: core_banking
    command: postgres -c wal_level=logical -c max_wal_senders=10 -c max_replication_slots=10
    ports:
      - "5433:5432"
    volumes:
      - core_banking_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U core -d core_banking"]
      interval: 5s
      timeout: 5s
      retries: 10

  state-db:
    image: postgres:16@sha256:be01cf82fc7dbba824acf0a82e150b4b360f3ff93c6631d7844af431e841a95c
    environment:
      POSTGRES_USER: state
      POSTGRES_PASSWORD: state
      POSTGRES_DB: twin_state
    ports:
      - "5434:5432"
    volumes:
      - state_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U state -d twin_state"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.7.0@sha256:41c20d65b0a2180b9deca056d47540771752e69fe9225d5748dd65a25a9675d7
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  schema-registry:
    image: confluentinc/cp-schema-registry:7.6.0@sha256:d23d8440708bb44daad5cba4195c070b9713c126375b355afb5ffedf7f1b94e7
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:9092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/subjects || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  debezium:
    image: debezium/connect:2.6@sha256:baa0dbbc404eb4da82e07c31482d6c63d8dc4e64c76260dd1933110235ee0809
    depends_on:
      kafka:
        condition: service_healthy
      core-banking-db:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: debezium
      CONFIG_STORAGE_TOPIC: debezium_configs
      OFFSET_STORAGE_TOPIC: debezium_offsets
      STATUS_STORAGE_TOPIC: debezium_statuses
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8083/connectors || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  state-service:
    build:
      context: ./services/state-service
      dockerfile: Dockerfile
    depends_on:
      state-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      debezium:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      STATE_DB_URL: postgres://state:state@state-db:5432/twin_state?sslmode=disable
      KAFKA_BROKERS: kafka:9092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      DEFAULT_TENANT_ID: "00000000-0000-0000-0000-000000000001"
      STATE_SERVICE_HTTP_ADDR: ":8080"
      STATE_SERVICE_SOURCE: state-service
      DEBEZIUM_TOPICS: domain.events.public.legal_entities,domain.events.public.accounts,domain.events.public.instruments
      STATE_CDC_DLQ_TOPIC: domain.events.dlq
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  alert-db:
    image: postgres:16@sha256:be01cf82fc7dbba824acf0a82e150b4b360f3ff93c6631d7844af431e841a95c
    environment:
      POSTGRES_USER: alert
      POSTGRES_PASSWORD: alert
      POSTGRES_DB: alerts
    ports:
      - "5435:5432"
    volumes:
      - alert_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alert -d alerts"]
      interval: 5s
      timeout: 5s
      retries: 10

  alert-service:
    build:
      context: ./services/alert-service
      dockerfile: Dockerfile
    depends_on:
      alert-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8085:8085"
    environment:
      ALERT_DB_URL: postgres://alert:alert@alert-db:5432/alerts?sslmode=disable
      KAFKA_BROKERS: kafka:9092
      DEFAULT_TENANT_ID: "00000000-0000-0000-0000-000000000001"
      ALERT_SERVICE_HTTP_ADDR: ":8085"
      ALERT_SERVICE_WS_PATH: /ws/alerts
      COMPLIANCE_ALERTS_TOPIC: compliance.alerts
      COMPLIANCE_ALERTS_DLQ_TOPIC: compliance.alerts.dlq
      KAFKA_AUDIT_PENDING_TOPIC: compliance.audit.pending
      KAFKA_AUDIT_RECORDED_TOPIC: compliance.audit.recorded
      ALERT_SERVICE_SOURCE: alert-service
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8085/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  flink-jobmanager:
    image: flink:1.20-java17@sha256:5a781c3a3bf694d4befba7709fbc192403a461c2d852fed533587a0970e03f5e
    ports:
      - "8082:8081"
      - "9249:9249"
    command: jobmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 2
        parallelism.default: 2
        metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
        metrics.reporter.prom.port: 9249
    volumes:
      - flink_checkpoints:/tmp/flink-checkpoints
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/overview || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s

  flink-taskmanager:
    image: flink:1.20-java17@sha256:5a781c3a3bf694d4befba7709fbc192403a461c2d852fed533587a0970e03f5e
    depends_on:
      flink-jobmanager:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      decision-service:
        condition: service_healthy
    command: taskmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 2
        parallelism.default: 2
    volumes:
      - flink_checkpoints:/tmp/flink-checkpoints

  flink-job-submitter:
    image: maven:3.9-eclipse-temurin-17@sha256:1ed5d1f54416b706707b4f3238f63a20bb06aab27c6d240090a2bb9ad895ed45
    depends_on:
      flink-taskmanager:
        condition: service_started
      flink-jobmanager:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      alert-service:
        condition: service_healthy
      decision-service:
        condition: service_healthy
    working_dir: /workspace
    volumes:
      - .:/workspace
    environment:
      FLINK_JOBMANAGER_URL: http://flink-jobmanager:8081
      CEP_VELOCITY_MAX_PER_HOUR: "50"
      CEP_EXPOSURE_LIMIT_EUR: "10000000"
      CEP_LCR_MINIMUM: "1.0"
      CEP_DECISION_SERVICE_URL: http://decision-service:8092
      FLINK_PARALLELISM: "1"
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        apt-get update -qq && apt-get install -y -qq curl jq >/dev/null
        cd /workspace/jobs/compliance-cep && mvn -q package -DskipTests
        cd /workspace && FLINK_JOBMANAGER_URL=http://flink-jobmanager:8081 ./scripts/submit-flink-job.sh
        echo "Flink job submitter done; sleeping to keep container alive for logs"
        sleep infinity
    restart: "no"

  alert-console:
    build:
      context: .
      dockerfile: apps/alert-console/Dockerfile
    depends_on:
      alert-service:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      ALERT_SERVICE_URL: http://alert-service:8085
      NEXT_PUBLIC_ALERT_CONSOLE_URL: http://localhost:3000
      NEXT_PUBLIC_AUDIT_EXPLORER_URL: http://localhost:3002
      NEXT_PUBLIC_GRAPH_EXPLORER_URL: http://localhost:3003
      NEXT_PUBLIC_SIMULATION_CONSOLE_URL: http://localhost:3004
      NEXT_PUBLIC_REPORT_CONSOLE_URL: http://localhost:3005

  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.7.0@sha256:e90b7ba06d97717224d67774fc7f208c26d1c4dafd4c8011185b0d45b5b38ace
    depends_on:
      kafka:
        condition: service_healthy
    command:
      - --kafka.server=kafka:9092
    ports:
      - "9308:9308"

  prometheus:
    image: prom/prometheus:v2.52.0@sha256:5c435642ca4d8427ca26f4901c11114023004709037880cd7860d5b7176aa731
    depends_on:
      kafka-exporter:
        condition: service_started
      flink-jobmanager:
        condition: service_healthy
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  immudb:
    image: codenotary/immudb@sha256:1053c2c254473670412b6f7257f61b6c09469b9b53b50c02bc7378ba775dc429
    ports:
      - "3322:3322"
      - "9497:9497"
    environment:
      IMMUDB_ADDRESS: 0.0.0.0
      IMMUDB_PORT: 3322
      IMMUDB_METRICS_PORT: 9497
    volumes:
      - immudb_data:/var/lib/immudb
    healthcheck:
      test: ["CMD", "/usr/local/bin/immuadmin", "status"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s

  audit-db:
    image: postgres:16@sha256:be01cf82fc7dbba824acf0a82e150b4b360f3ff93c6631d7844af431e841a95c
    environment:
      POSTGRES_USER: audit
      POSTGRES_PASSWORD: audit
      POSTGRES_DB: audit
    ports:
      - "5436:5432"
    volumes:
      - audit_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U audit -d audit"]
      interval: 5s
      timeout: 5s
      retries: 10

  audit-service:
    build:
      context: ./services/audit-service
      dockerfile: Dockerfile
    depends_on:
      audit-db:
        condition: service_healthy
      immudb:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8090:8090"
    environment:
      AUDIT_DB_URL: postgres://audit:audit@audit-db:5432/audit?sslmode=disable
      KAFKA_BROKERS: kafka:9092
      IMMUDB_HOST: immudb
      IMMUDB_PORT: "3322"
      IMMUDB_DATABASE: digitaltwin_audit
      IMMUDB_USER: immudb
      IMMUDB_PASSWORD: immudb
      AUDIT_SERVICE_HTTP_ADDR: ":8090"
      KAFKA_AUDIT_PENDING_TOPIC: compliance.audit.pending
      KAFKA_AUDIT_RECORDED_TOPIC: compliance.audit.recorded
      AUDIT_ARTIFACT_DIR: /data/audit-artifacts
      DEFAULT_TENANT_ID: "00000000-0000-0000-0000-000000000001"
    volumes:
      - audit_artifacts:/data/audit-artifacts
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8090/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 25s

  cedar-service:
    build:
      context: ./services/cedar-service
      dockerfile: Dockerfile
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8091:8091"
    environment:
      KAFKA_BROKERS: kafka:9092
      CEDAR_SERVICE_HTTP_ADDR: ":8091"
      CEDAR_POLICY_DIR: /policies/cedar
      CEDAR_SERVICE_JWT_SECRET: dev-cedar-jwt-secret-min-32-chars!!
      KAFKA_AUDIT_PENDING_TOPIC: compliance.audit.pending
      DEFAULT_PRINCIPAL: operator-dev
      DEFAULT_ROLES: Analyst
    volumes:
      - ./policies/cedar:/policies/cedar:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8091/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  decision-service:
    build:
      context: ./services/decision-service
      dockerfile: Dockerfile
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8092:8092"
    environment:
      KAFKA_BROKERS: kafka:9092
      DECISION_SERVICE_HTTP_ADDR: ":8092"
      ZEN_POLICY_DIR: /policies/zen
      KAFKA_AUDIT_PENDING_TOPIC: compliance.audit.pending
    volumes:
      - ./policies/zen:/policies/zen:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8092/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  audit-explorer:
    build:
      context: .
      dockerfile: apps/audit-explorer/Dockerfile
    depends_on:
      audit-service:
        condition: service_healthy
    ports:
      - "3002:3000"
    environment:
      AUDIT_SERVICE_URL: http://audit-service:8090
      NEXT_PUBLIC_ALERT_CONSOLE_URL: http://localhost:3000
      NEXT_PUBLIC_AUDIT_EXPLORER_URL: http://localhost:3002
      NEXT_PUBLIC_GRAPH_EXPLORER_URL: http://localhost:3003
      NEXT_PUBLIC_SIMULATION_CONSOLE_URL: http://localhost:3004
      NEXT_PUBLIC_REPORT_CONSOLE_URL: http://localhost:3005

  neo4j:
    image: neo4j:5-community@sha256:4bae36aff76271e27fd6a6ed0835413f86a284cd179cfb1cb7d188f5f7533aca
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/changeme
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  graph-service:
    build:
      context: ./services/graph-service
      dockerfile: Dockerfile
    depends_on:
      neo4j:
        condition: service_healthy
      kafka:
        condition: service_healthy
      state-service:
        condition: service_healthy
    ports:
      - "8093:8093"
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: changeme
      KAFKA_BROKERS: kafka:9092
      GRAPH_SERVICE_HTTP_ADDR: ":8093"
      DEFAULT_TENANT_ID: "00000000-0000-0000-0000-000000000001"
      TWIN_STATE_TOPIC: twin.state.updated
      TWIN_STATE_DLQ_TOPIC: twin.state.updated.dlq
      DOMAIN_INSTRUMENTS_DLQ_TOPIC: domain.events.public.instruments.dlq
      GRAPH_CONSUMER_GROUP: graph-service
      GRAPH_INSTRUMENTS_CONSUMER_GROUP: graph-service-instruments
      GRAPH_SERVICE_SOURCE: graph-service
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8093/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 25s

  simulation-service:
    build:
      context: ./services/simulation-service
      dockerfile: Dockerfile
    depends_on:
      graph-service:
        condition: service_healthy
      kafka:
        condition: service_healthy
      decision-service:
        condition: service_healthy
    ports:
      - "8094:8094"
    environment:
      GRAPH_SERVICE_URL: http://graph-service:8093
      DECISION_SERVICE_URL: http://decision-service:8092
      KAFKA_BROKERS: kafka:9092
      KAFKA_AUDIT_PENDING_TOPIC: compliance.audit.pending
      DEFAULT_TENANT_ID: "00000000-0000-0000-0000-000000000001"
      SIMULATION_SERVICE_HTTP_ADDR: ":8094"
      SIMULATION_SERVICE_SOURCE: simulation-service
      EFFECTIVENESS_BREACHES_PATH: /fixtures/phase7/breaches.json
    volumes:
      - ./fixtures/phase7:/fixtures/phase7:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8094/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  graph-explorer:
    build:
      context: .
      dockerfile: apps/graph-explorer/Dockerfile
    depends_on:
      graph-service:
        condition: service_healthy
    ports:
      - "3003:3000"
    environment:
      GRAPH_SERVICE_URL: http://graph-service:8093
      NEXT_PUBLIC_ALERT_CONSOLE_URL: http://localhost:3000
      NEXT_PUBLIC_AUDIT_EXPLORER_URL: http://localhost:3002
      NEXT_PUBLIC_GRAPH_EXPLORER_URL: http://localhost:3003
      NEXT_PUBLIC_SIMULATION_CONSOLE_URL: http://localhost:3004
      NEXT_PUBLIC_REPORT_CONSOLE_URL: http://localhost:3005

  simulation-console:
    build:
      context: .
      dockerfile: apps/simulation-console/Dockerfile
    depends_on:
      simulation-service:
        condition: service_healthy
    ports:
      - "3004:3000"
    environment:
      SIMULATION_SERVICE_URL: http://simulation-service:8094
      NEXT_PUBLIC_ALERT_CONSOLE_URL: http://localhost:3000
      NEXT_PUBLIC_AUDIT_EXPLORER_URL: http://localhost:3002
      NEXT_PUBLIC_GRAPH_EXPLORER_URL: http://localhost:3003
      NEXT_PUBLIC_SIMULATION_CONSOLE_URL: http://localhost:3004
      NEXT_PUBLIC_REPORT_CONSOLE_URL: http://localhost:3005

  minio:
    # Official minio/minio Hub images are source-only / pull-denied (2025-10).
    # Last CVE-patched community rebuild that GitHub Actions can pull anonymously.
    image: coollabsio/minio:RELEASE.2025-10-15T17-29-55Z
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data

  reporting-db:
    image: postgres:16
    environment:
      POSTGRES_USER: reporting
      POSTGRES_PASSWORD: reporting
      POSTGRES_DB: reporting
    ports:
      - "5437:5432"
    volumes:
      - reporting_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reporting -d reporting"]
      interval: 5s
      timeout: 5s
      retries: 10

  reporting-service:
    build:
      context: ./services/reporting-service
      dockerfile: Dockerfile
    depends_on:
      reporting-db:
        condition: service_healthy
      minio:
        condition: service_started
      kafka:
        condition: service_healthy
      audit-service:
        condition: service_healthy
    ports:
      - "8095:8095"
    environment:
      REPORTING_DB_URL: postgres://reporting:reporting@reporting-db:5432/reporting?sslmode=disable
      STATE_SERVICE_URL: http://state-service:8080
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minio
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: regulatory-reports
      MINIO_SECURE: "0"
      KAFKA_BROKERS: kafka:9092
      KAFKA_AUDIT_PENDING_TOPIC: compliance.audit.pending
      DEFAULT_TENANT_ID: "00000000-0000-0000-0000-000000000001"
      REPORTING_SERVICE_HTTP_ADDR: ":8095"
      REPORTING_SERVICE_SOURCE: reporting-service
      TAXONOMY_VERSION_DEFAULT: "2024.1"
      REPORTING_FIXTURES_DIR: /fixtures/taxonomies
    volumes:
      - ./fixtures/taxonomies:/fixtures/taxonomies:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8095/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  report-console:
    build:
      context: .
      dockerfile: apps/report-console/Dockerfile
    depends_on:
      reporting-service:
        condition: service_healthy
    ports:
      - "3005:3000"
    environment:
      REPORTING_SERVICE_URL: http://reporting-service:8095
      NEXT_PUBLIC_ALERT_CONSOLE_URL: http://localhost:3000
      NEXT_PUBLIC_AUDIT_EXPLORER_URL: http://localhost:3002
      NEXT_PUBLIC_GRAPH_EXPLORER_URL: http://localhost:3003
      NEXT_PUBLIC_SIMULATION_CONSOLE_URL: http://localhost:3004
      NEXT_PUBLIC_REPORT_CONSOLE_URL: http://localhost:3005

  grafana:
    image: grafana/grafana:10.4.0@sha256:f9811e4e687ffecf1a43adb9b64096c50bc0d7a782f8608530f478b6542de7d5
    depends_on:
      prometheus:
        condition: service_started
    ports:
      - "3030:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

